name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The package claims engines.node >= 18, so the pure-JS half is exercised on
  # more than one runtime. The browser half only needs one.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  # The .d.ts files are generated from the JSDoc in src/, so this job is really
  # two checks: `npm run build` fails when an annotation is wrong, and
  # `test:types` compiles a consumer that imports the package by name, which is
  # the only way a missing `types` condition in the exports map shows up before
  # someone installs the published tarball.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:types

  # dist/ is committed so the package can be installed straight from git,
  # where no build ever runs. This is the guard that keeps it honest, and it
  # now covers dist/types/ as well.
  dist-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist/ matches src/
        run: git diff --exit-code -- dist/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
